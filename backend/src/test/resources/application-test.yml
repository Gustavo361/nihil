# Automated tests use H2 so they do not require a running PostgreSQL instance.
spring:
  main:
    banner-mode: "off"
  datasource:
    url: jdbc:h2:mem:nihil;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration-h2
