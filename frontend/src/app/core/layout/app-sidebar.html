<aside class="sidebar" [class.sidebar--open]="open()" aria-label="Navegação principal">
  <div class="sidebar__brand">
    <span class="sidebar__mark" aria-hidden="true">N</span>
    <span class="sidebar__name">NIHIL</span>
  </div>

  <nav class="sidebar__nav">
    @for (group of groups; track group.label) {
      <div class="sidebar__group">
        <p class="sidebar__group-label">{{ group.label }}</p>
        <ul class="sidebar__list">
          @for (item of group.items; track item.path) {
            <li>
              <a
                class="sidebar__link"
                [routerLink]="item.path"
                routerLinkActive="sidebar__link--active"
                [routerLinkActiveOptions]="{ exact: item.exact === true }"
                (click)="onNavigate()"
              >
                <tabler-icon [icon]="item.icon" [size]="20" [stroke]="1.75" aria-hidden="true" />
                <span>{{ item.label }}</span>
              </a>
            </li>
          }
        </ul>
      </div>
    }
  </nav>

  <div class="sidebar__footer">
    <div class="sidebar__avatar" aria-hidden="true">U</div>
    <div class="sidebar__user">
      <span class="sidebar__user-name">Usuário</span>
      <span class="sidebar__user-role">Administrador</span>
    </div>
  </div>
</aside>
