<div class="shell" [class.shell--menu-open]="menuOpen()">
  <button
    type="button"
    class="shell__menu-btn"
    (click)="toggleMenu()"
    [attr.aria-expanded]="menuOpen()"
    aria-controls="nihil-sidebar"
  >
    <tabler-icon [icon]="menuOpen() ? iconClose : iconMenu" [size]="22" [stroke]="1.75" />
    <span class="visually-hidden">{{ menuOpen() ? 'Fechar menu' : 'Abrir menu' }}</span>
  </button>

  @if (menuOpen()) {
    <button
      type="button"
      class="shell__backdrop"
      aria-label="Fechar menu"
      (click)="closeMenu()"
    ></button>
  }

  <div id="nihil-sidebar" class="shell__sidebar">
    <app-sidebar [open]="menuOpen()" (navigate)="closeMenu()" />
  </div>

  <div class="shell__workspace">
    <header class="shell__header">
      <h1 class="shell__title">
        <tabler-icon
          class="shell__title-icon"
          [icon]="pageMeta().icon"
          [size]="26"
          [stroke]="1.75"
          aria-hidden="true"
        />
        <span>{{ pageMeta().title }}</span>
      </h1>

      <div class="shell__actions">
        <div class="shell__header-menu" [class.shell__header-menu--open]="openHeaderMenu() === 'notifications'">
          <button
            type="button"
            class="shell__action-trigger"
            title="Notificações"
            aria-label="Notificações"
            [attr.aria-expanded]="openHeaderMenu() === 'notifications'"
            aria-haspopup="true"
            (click)="toggleHeaderMenu('notifications', $event)"
          >
            <span class="shell__action">
              <tabler-icon [icon]="iconBell" [size]="20" [stroke]="1.75" aria-hidden="true" />
            </span>
            <tabler-icon
              class="shell__action-chevron"
              [icon]="openHeaderMenu() === 'notifications' ? iconChevronUp : iconChevronDown"
              [size]="16"
              [stroke]="2"
              aria-hidden="true"
            />
          </button>

          @if (openHeaderMenu() === 'notifications') {
            <div class="shell__dropdown" role="menu" aria-label="Notificações">
              <p class="shell__dropdown-title">Notificações</p>
              <p class="shell__dropdown-empty">Nenhuma notificação por enquanto.</p>
            </div>
          }
        </div>

        <div class="shell__header-menu" [class.shell__header-menu--open]="openHeaderMenu() === 'theme'">
          <button
            type="button"
            class="shell__action-trigger"
            title="Modo de exibição"
            aria-label="Modo de exibição"
            [attr.aria-expanded]="openHeaderMenu() === 'theme'"
            aria-haspopup="true"
            (click)="toggleHeaderMenu('theme', $event)"
          >
            <span class="shell__action">
              <tabler-icon
                [icon]="themeMode() === 'dark' ? iconTheme : iconSun"
                [size]="20"
                [stroke]="1.75"
                aria-hidden="true"
              />
            </span>
            <tabler-icon
              class="shell__action-chevron"
              [icon]="openHeaderMenu() === 'theme' ? iconChevronUp : iconChevronDown"
              [size]="16"
              [stroke]="2"
              aria-hidden="true"
            />
          </button>

          @if (openHeaderMenu() === 'theme') {
            <div class="shell__dropdown shell__dropdown--theme" role="menu" aria-label="Modo de exibição">
              <p class="shell__dropdown-title">Modo</p>
              <button
                type="button"
                class="shell__dropdown-item"
                role="menuitemradio"
                [attr.aria-checked]="themeMode() === 'light'"
                [class.is-active]="themeMode() === 'light'"
                (click)="setTheme('light')"
              >
                <tabler-icon [icon]="iconSun" [size]="18" [stroke]="1.75" aria-hidden="true" />
                Claro
              </button>
              <button
                type="button"
                class="shell__dropdown-item"
                role="menuitemradio"
                [attr.aria-checked]="themeMode() === 'dark'"
                [class.is-active]="themeMode() === 'dark'"
                (click)="setTheme('dark')"
              >
                <tabler-icon [icon]="iconTheme" [size]="18" [stroke]="1.75" aria-hidden="true" />
                Escuro
              </button>
            </div>
          }
        </div>
      </div>
    </header>

    <main class="shell__main">
      <div class="shell__panel">
        <router-outlet />
      </div>
    </main>
  </div>
</div>
