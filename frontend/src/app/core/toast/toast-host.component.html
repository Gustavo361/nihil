<div class="toast-host" aria-live="polite" aria-relevant="additions">
  @for (toast of toasts(); track toast.id) {
    <div
      class="toast"
      [class.toast--success]="toast.tone === 'success'"
      [class.toast--info]="toast.tone === 'info'"
      [class.toast--danger]="toast.tone === 'danger'"
      role="status"
    >
      <span class="toast__icon" aria-hidden="true">
        <tabler-icon [icon]="iconFor(toast)" [size]="18" [stroke]="2" />
      </span>
      <div class="toast__message">
        <span class="toast__text">{{ toast.message }}</span>
        @if (toast.highlight) {
          <span class="toast__mark">{{ toast.highlight }}</span>
        }
      </div>
      <button type="button" class="toast__close" aria-label="Fechar" (click)="dismiss(toast)">
        <tabler-icon [icon]="iconClose" [size]="16" [stroke]="2" aria-hidden="true" />
      </button>
    </div>
  }
</div>
