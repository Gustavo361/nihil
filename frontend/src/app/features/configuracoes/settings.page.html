<section class="settings" aria-labelledby="settings-title">
  <p class="settings__eyebrow">Sistema</p>
  <h1 id="settings-title">Configurações</h1>
  <p class="settings__lead">Gerencie as opções da sua sessão.</p>

  <article class="settings__card">
    <div>
      <h2>Sessão</h2>
      <p>Encerre sua sessão neste dispositivo.</p>
    </div>
    <button type="button" (click)="logout()">Sair da conta</button>
  </article>
</section>
