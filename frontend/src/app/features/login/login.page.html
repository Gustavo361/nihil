<main class="login">
  <section class="login__card" aria-labelledby="login-title">
    <div class="login__brand" aria-hidden="true">N</div>
    <p class="login__eyebrow">Nihil · Gestão</p>
    <h1 id="login-title">Acesse sua conta</h1>
    <p class="login__lead">Entre para iniciar as operações do restaurante.</p>

    <form (ngSubmit)="submit()">
      <label for="username">Usuário</label>
      <input
        id="username"
        name="username"
        type="text"
        autocomplete="username"
        [ngModel]="username()"
        (ngModelChange)="username.set($event)"
        required
        autofocus
      />

      <label for="password">Senha</label>
      <div class="login__password-field">
        <input
          id="password"
          name="password"
          [type]="passwordVisible() ? 'text' : 'password'"
          autocomplete="current-password"
          [ngModel]="password()"
          (ngModelChange)="password.set($event)"
          required
        />
        <button
          type="button"
          class="login__password-toggle"
          [attr.aria-label]="passwordVisible() ? 'Ocultar senha' : 'Mostrar senha'"
          [attr.aria-pressed]="passwordVisible()"
          (click)="togglePasswordVisibility()"
        >
          <tabler-icon [icon]="passwordVisible() ? iconEyeOff : iconEye" [size]="20" aria-hidden="true" />
        </button>
      </div>

      @if (error()) { <p class="login__error" role="alert">{{ error() }}</p> }

      <button type="submit" [disabled]="busy() || !username() || !password()" [attr.aria-busy]="busy()">
        @if (busy()) {
          <span>Entrando</span><span class="login__dots" aria-hidden="true"><i>.</i><i>.</i><i>.</i></span>
        } @else {
          Entrar
        }
      </button>
    </form>
  </section>
</main>
